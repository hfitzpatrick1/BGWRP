<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="dts-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="das-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="overlap-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Arial, sans-serif">
    Complementary Distributed Fiber Optic Sensing
  </text>
  <text x="500" y="70" font-size="18" fill="#6b7280" text-anchor="middle" font-family="Arial, sans-serif">
    Two measurements, one cable - complete subsurface intelligence
  </text>

  <!-- DTS Circle (Left) -->
  <circle cx="380" cy="350" r="220" fill="url(#dts-gradient)" opacity="0.7" stroke="#1e40af" stroke-width="3"/>
  
  <!-- DAS Circle (Right) -->
  <circle cx="540" cy="350" r="220" fill="url(#das-gradient)" opacity="0.7" stroke="#047857" stroke-width="3"/>
  
  <!-- Overlap area -->
  <path d="M 380 130 A 220 220 0 0 1 540 130 A 220 220 0 0 1 540 570 A 220 220 0 0 1 380 570 A 220 220 0 0 1 380 130 Z" 
        fill="url(#overlap-gradient)" opacity="0.8" stroke="#0f766e" stroke-width="3"/>

  <!-- DTS Labels -->
  <text x="240" y="280" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">DTS</text>
  <text x="240" y="305" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Distributed Temperature Sensing</text>
  
  <text x="240" y="340" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Raman backscatter analysis</text>
  <text x="240" y="360" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Thermal profiling & gradients</text>
  <text x="240" y="380" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Subsurface heat transport</text>
  <text x="240" y="400" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Thermal conductivity mapping</text>

  <!-- DAS Labels -->
  <text x="680" y="280" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">DAS</text>
  <text x="680" y="305" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Distributed Acoustic Sensing</text>
  
  <text x="680" y="340" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Rayleigh backscatter analysis</text>
  <text x="680" y="360" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Strain & vibration detection</text>
  <text x="680" y="380" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Seismic wave propagation</text>
  <text x="680" y="400" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Microseismic monitoring</text>

  <!-- Overlap Labels -->
  <text x="460" y="330" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Integrated Sensing</text>
  <text x="460" y="360" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Multimode fiber (DTS)</text>
  <text x="460" y="380" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Single mode fiber (DAS)</text>
  <text x="460" y="400" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Multi-parameter analysis</text>
  <text x="460" y="420" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Cross-correlation methods</text>
  <text x="460" y="440" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">• Advanced signal processing</text>

  <!-- Bottom Applications -->
  <rect x="50" y="580" width="900" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  <text x="200" y="610" font-size="16" font-weight="600" fill="#0f766e" text-anchor="middle" font-family="Arial, sans-serif">Geothermal</text>
  <text x="200" y="630" font-size="14" fill="#374151" text-anchor="middle" font-family="Arial, sans-serif">Thermal gradients + seismic activity</text>
  <text x="500" y="610" font-size="16" font-weight="600" fill="#0f766e" text-anchor="middle" font-family="Arial, sans-serif">Infrastructure</text>
  <text x="500" y="630" font-size="14" fill="#374151" text-anchor="middle" font-family="Arial, sans-serif">Thermal stress + structural vibration</text>
  <text x="800" y="610" font-size="16" font-weight="600" fill="#0f766e" text-anchor="middle" font-family="Arial, sans-serif">Environmental</text>
  <text x="800" y="630" font-size="14" fill="#374151" text-anchor="middle" font-family="Arial, sans-serif">Groundwater flow + subsurface movement</text>

  <!-- Fiber representation -->
  <line x1="100" y1="95" x2="900" y2="95" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
  <line x1="100" y1="105" x2="900" y2="105" stroke="#10b981" stroke-width="3" opacity="0.8"/>
  <text x="500" y="85" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">Multi-fiber Cable</text>
  <text x="300" y="125" font-size="12" fill="#3b82f6" text-anchor="middle" font-family="Arial, sans-serif">Multimode (DTS)</text>
  <text x="700" y="125" font-size="12" fill="#10b981" text-anchor="middle" font-family="Arial, sans-serif">Single mode (DAS)</text>
</svg>


