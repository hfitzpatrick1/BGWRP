<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="750" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">
    Complementary Distributed Fiber Optic Sensing
  </text>
  <text x="500" y="70" font-size="18" text-anchor="middle" fill="#6b7280">
    Two measurements, one cable - integrated analysis
  </text>
  
  <!-- DTS Circle (Left) -->
  <circle cx="380" cy="380" r="220" fill="#3b82f6" opacity="0.7" stroke="#1e40af" stroke-width="3"/>
  
  <!-- DAS Circle (Right) -->
  <circle cx="620" cy="380" r="220" fill="#10b981" opacity="0.7" stroke="#047857" stroke-width="3"/>
  
  <!-- DTS Labels -->
  <text x="250" y="320" font-size="22" font-weight="bold" text-anchor="middle" fill="black">DTS</text>
  <text x="250" y="345" font-size="16" text-anchor="middle" fill="black">Temperature Sensing</text>
  <text x="250" y="365" font-size="14" text-anchor="middle" fill="black">Raman backscatter</text>
  <text x="250" y="390" font-size="13" text-anchor="middle" fill="black">• Thermal gradients</text>
  <text x="250" y="410" font-size="13" text-anchor="middle" fill="black">• Flow paths &amp; connectivity</text>
  <text x="250" y="430" font-size="13" text-anchor="middle" fill="black">• Source of water</text>
  <text x="250" y="450" font-size="12" font-style="italic" text-anchor="middle" fill="#1e40af">Tracer of fluid movement</text>
  
  <!-- DAS Labels -->
  <text x="750" y="320" font-size="22" font-weight="bold" text-anchor="middle" fill="black">DAS</text>
  <text x="750" y="345" font-size="16" text-anchor="middle" fill="black">Strain Rate Sensing</text>
  <text x="750" y="365" font-size="14" text-anchor="middle" fill="black">Rayleigh backscatter</text>
  <text x="750" y="385" font-size="13" text-anchor="middle" fill="black">• Poroelastic response</text>
  <text x="750" y="405" font-size="13" text-anchor="middle" fill="black">• Spatial distribution</text>
  <text x="750" y="425" font-size="13" text-anchor="middle" fill="black">• Mechanical &amp; storage</text>
  <text x="750" y="445" font-size="13" text-anchor="middle" fill="black">• Dynamic processes</text>
  <text x="750" y="465" font-size="12" font-style="italic" text-anchor="middle" fill="#047857">Rate of deformation</text>
  
  <!-- Overlap Labels -->
  <text x="500" y="320" font-size="18" font-weight="bold" text-anchor="middle" fill="black">Integrated Sensing</text>
  <text x="500" y="350" font-size="14" text-anchor="middle" fill="black">• Multi-parameter analysis</text>
  <text x="500" y="370" font-size="14" text-anchor="middle" fill="black">• Cross-correlation</text>
  <text x="500" y="390" font-size="14" text-anchor="middle" fill="black">• Basin characterization</text>
  <text x="500" y="410" font-size="14" text-anchor="middle" fill="black">• Environmental monitoring</text>
  
  <!-- Key Insight Box -->
  <rect x="200" y="520" width="600" height="120" fill="white" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="500" y="545" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Together is Better!</text>
  <text x="500" y="570" font-size="14" text-anchor="middle" fill="#1f2937">DTS reveals fluid dynamics (where water moves)</text>
  <text x="500" y="590" font-size="14" text-anchor="middle" fill="#1f2937">DAS reveals mechanical dynamics (where formation responds)</text>
  <text x="500" y="615" font-size="13" font-style="italic" text-anchor="middle" fill="#6b7280">Integrated analysis provides richer understanding than either alone</text>
  
  <!-- Fiber representation -->
  <line x1="100" y1="100" x2="900" y2="100" stroke="#3b82f6" stroke-width="3"/>
  <line x1="100" y1="110" x2="900" y2="110" stroke="#10b981" stroke-width="3"/>
  <text x="500" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Multi-fiber Cable</text>
  <text x="260" y="130" font-size="12" text-anchor="middle" fill="#3b82f6">Multimode (DTS)</text>
  <text x="700" y="130" font-size="12" text-anchor="middle" fill="#10b981">Singlemode (DAS)</text>
</svg>
