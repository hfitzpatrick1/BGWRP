<?xml version="1.0" encoding="UTF-8"?>
<!-- PM-07 (5-zone nested monitoring well) and PT-01c (extraction) schematic
     PM-07 construction:
       Zone 1 (deepest): 0-645 ft casing, 645-665 ft screen (DAS fiber strapped to casing)
       Zone 2: 0-485 ft casing, 485-505 ft screen
       Zone 3: 0-420 ft casing, 420-440 ft screen
       Zone 4: 0-360 ft casing, 360-380 ft screen
       Zone 5 (shallowest): 0-290 ft casing, 290-310 ft screen
     Scale: 1.2 px/ft vertical
     Edit freely in any SVG editor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100">
  <defs>
    <linearGradient id="bellflower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b3b3"/>
      <stop offset="100%" stop-color="#d28686"/>
    </linearGradient>
    <linearGradient id="gage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe792"/>
      <stop offset="100%" stop-color="#e7c760"/>
    </linearGradient>
    <linearGradient id="lynwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#97b7ff"/>
      <stop offset="100%" stop-color="#6a93f0"/>
    </linearGradient>
    <linearGradient id="brackish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e6c97"/>
      <stop offset="100%" stop-color="#56547a"/>
    </linearGradient>
    <linearGradient id="lsp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb788"/>
      <stop offset="100%" stop-color="#4f9b6b"/>
    </linearGradient>
    <pattern id="screen-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e3f2ff"/>
      <path d="M0 0 L0 8" stroke="#5b9fff" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="1800" height="110" fill="#4f7bd6"/>
  <text x="40" y="52" fill="#ffffff" font-size="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">Cross Section: PM-07 (5-zone nested) and PT-01c (extraction)</text>
  <text x="40" y="90" fill="#eaf2ff" font-size="24" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">DAS fiber strapped to PM-07 Zone 1 casing; pump test temperature and axial strain monitoring</text>

  <!-- Depth axis and grid (0–700 ft bgs) -->
  <g id="grid" transform="translate(0,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1800" height="840" fill="#ffffff"/>
    <g stroke="#d1d5db" stroke-dasharray="4 4" opacity="0.6">
      <!-- 50 ft spacing: 60 px per 50 ft = 1.2 px/ft -->
      <line x1="20" y1="0" x2="1780" y2="0"/>
      <line x1="20" y1="60" x2="1780" y2="60"/>
      <line x1="20" y1="120" x2="1780" y2="120"/>
      <line x1="20" y1="180" x2="1780" y2="180"/>
      <line x1="20" y1="240" x2="1780" y2="240"/>
      <line x1="20" y1="300" x2="1780" y2="300"/>
      <line x1="20" y1="360" x2="1780" y2="360"/>
      <line x1="20" y1="420" x2="1780" y2="420"/>
      <line x1="20" y1="480" x2="1780" y2="480"/>
      <line x1="20" y1="540" x2="1780" y2="540"/>
      <line x1="20" y1="600" x2="1780" y2="600"/>
      <line x1="20" y1="660" x2="1780" y2="660"/>
      <line x1="20" y1="720" x2="1780" y2="720"/>
      <line x1="20" y1="780" x2="1780" y2="780"/>
      <line x1="20" y1="840" x2="1780" y2="840"/>
    </g>
    <g id="depth-axis" transform="translate(20,0)" fill="#374151" font-size="15" font-weight="600">
      <rect x="-6" y="0" width="6" height="840" fill="#111827"/>
      <text x="16" y="5">0 ft</text>
      <text x="16" y="65">50 ft</text>
      <text x="16" y="125">100 ft</text>
      <text x="16" y="185">150 ft</text>
      <text x="16" y="245">200 ft</text>
      <text x="16" y="305">250 ft</text>
      <text x="16" y="365">300 ft</text>
      <text x="16" y="425">350 ft</text>
      <text x="16" y="485">400 ft</text>
      <text x="16" y="545">450 ft</text>
      <text x="16" y="605">500 ft</text>
      <text x="16" y="665">550 ft</text>
      <text x="16" y="725">600 ft</text>
      <text x="16" y="785">650 ft</text>
      <text x="16" y="845">700 ft</text>
    </g>
  </g>

  <!-- Formations (approximate thicknesses, 1.2 px/ft) -->
  <g id="formations" transform="translate(0,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="120" y="0" width="1560" height="180" fill="url(#bellflower)"/>
    <rect x="120" y="180" width="1560" height="180" fill="url(#gage)"/>
    <rect x="120" y="360" width="1560" height="240" fill="url(#lynwood)"/>
    <rect x="120" y="600" width="1560" height="140" fill="url(#brackish)"/>
    <rect x="120" y="740" width="1560" height="100" fill="url(#lsp)"/>

    <g fill="#1f2937" opacity="0.85">
      <text x="1440" y="80">Bellflower Aquiclude</text>
      <text x="1440" y="260">Gage/Gardena Aquifer</text>
      <text x="1440" y="460">Lynwood/Silverado Aquifer</text>
      <text x="1440" y="660" fill="#f8fafc">Lynwood/Silverado Brackish</text>
      <text x="1440" y="800" fill="#ffffff">Lower San Pedro Formation</text>
    </g>
  </g>

  <!-- PM-07 nested well (5 zones) - scale 1.2 px/ft -->
  <g id="PM-07" transform="translate(400,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-40" y="-20" font-size="26" font-weight="700" fill="#111827">PM-07</text>
    
    <!-- Borehole envelope -->
    <ellipse cx="0" cy="400" rx="90" ry="400" fill="#e0e0e0" opacity="0.4"/>
    
    <!-- Zone 5 (shallowest): 0-290 casing, 290-310 screen -->
    <g id="zone5">
      <rect x="-70" y="0" width="16" height="348" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
      <rect x="-70" y="348" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
      <text x="-92" y="-8" font-size="14" font-weight="700" fill="#111827">Z5</text>
      <text x="-140" y="360" font-size="12" fill="#374151">290-310'</text>
    </g>
    
    <!-- Zone 4: 0-360 casing, 360-380 screen -->
    <g id="zone4">
      <rect x="-46" y="0" width="16" height="432" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
      <rect x="-46" y="432" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
      <text x="-68" y="-8" font-size="14" font-weight="700" fill="#111827">Z4</text>
      <text x="-140" y="444" font-size="12" fill="#374151">360-380'</text>
    </g>
    
    <!-- Zone 3: 0-420 casing, 420-440 screen -->
    <g id="zone3">
      <rect x="-22" y="0" width="16" height="504" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
      <rect x="-22" y="504" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
      <text x="-44" y="-8" font-size="14" font-weight="700" fill="#111827">Z3</text>
      <text x="-140" y="516" font-size="12" fill="#374151">420-440'</text>
    </g>
    
    <!-- Zone 2: 0-485 casing, 485-505 screen -->
    <g id="zone2">
      <rect x="2" y="0" width="16" height="582" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
      <rect x="2" y="582" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
      <text x="-20" y="-8" font-size="14" font-weight="700" fill="#111827">Z2</text>
      <text x="-140" y="594" font-size="12" fill="#374151">485-505'</text>
    </g>
    
    <!-- Zone 1 (deepest): 0-645 casing, 645-665 screen + DAS fiber -->
    <g id="zone1">
      <rect x="26" y="0" width="16" height="774" fill="#8b9aa6" stroke="#111827" stroke-width="2.5"/>
      <rect x="26" y="774" width="16" height="24" fill="url(#screen-hatch)" stroke="#111827" stroke-width="2.5"/>
      <!-- Fiber strapped to outside of Zone 1 casing -->
      <rect x="43" y="0" width="5" height="798" fill="#ff2c55"/>
      <text x="4" y="-8" font-size="14" font-weight="700" fill="#111827">Z1</text>
      <text x="-140" y="786" font-size="12" fill="#111827" font-weight="700">645-665'</text>
      <text x="54" y="400" font-size="16" fill="#ff2c55" font-weight="700" transform="rotate(90 54 400)">DAS fiber</text>
    </g>
  </g>

  <!-- PT-01c extraction well (approximate screen 400-550 ft) -->
  <g id="PT-01c" transform="translate(1400,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-30" y="-20" font-size="26" font-weight="700" fill="#111827">PT-01c</text>
    <!-- Casing -->
    <rect x="-50" y="0" width="100" height="480" fill="#6b7280" stroke="#374151" stroke-width="2"/>
    <!-- Screen interval (approx 400-550 ft = 480-660 px) -->
    <rect x="-50" y="480" width="100" height="180" fill="#2563eb" opacity="0.7" stroke="#1e40af" stroke-width="2"/>
    <!-- Sump -->
    <rect x="-50" y="660" width="100" height="20" fill="#0f172a"/>
    <!-- Pump symbol -->
    <rect x="-30" y="540" width="60" height="40" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="-20" y="565" font-size="16" font-weight="700" fill="#92400e">PUMP</text>
    <!-- Extraction arrow -->
    <path d="M50,560 L130,560" stroke="#111827" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="140" y="568" font-size="16" fill="#111827">Extraction</text>
  </g>

  <!-- Flow towards PT-01c -->
  <g id="flow" transform="translate(0,140)">
    <path d="M550,520 L1340,580" stroke="#1e40af" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="800" y="540" font-size="18" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1e40af" font-weight="600">Lateral flow during pumping</text>
  </g>

  <!-- Callouts for temperature and strain -->
  <g id="callouts" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">
    <!-- Temperature response -->
    <path d="M1200,720 C1100,700 1000,680 900,650" fill="none" stroke="#0aa" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="1040" y="715" width="440" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="1055" y="745" font-size="18" fill="#0aa">Temperature drop (advection + expansion)</text>
    </g>
    
    <!-- Axial strain on Zone 1 -->
    <path d="M520,800 C600,820 700,840 800,850" fill="none" stroke="#8e44ad" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="220" y="840" width="520" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="235" y="870" font-size="18" fill="#8e44ad">Axial strain from drawdown (poroelastic response)</text>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(60,1000)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="880" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(20,24)" font-size="16" fill="#111827">
      <rect x="0" y="-10" width="28" height="12" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
      <text x="38" y="-2">Casing</text>
      
      <rect x="140" y="-10" width="28" height="12" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
      <text x="178" y="-2">Screen</text>
      
      <rect x="280" y="-10" width="28" height="12" fill="#ff2c55"/>
      <text x="318" y="-2">Fiber optic (DAS)</text>
      
      <rect x="520" y="-10" width="28" height="12" fill="#2563eb"/>
      <text x="558" y="-2">PT-01c screen</text>
      
      <rect x="0" y="28" width="28" height="12" fill="#97b7ff"/>
      <text x="38" y="36">Lynwood/Silverado aquifer</text>
      
      <rect x="340" y="28" width="28" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="378" y="36">Submersible pump</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="1090" fill="#6b7280" font-size="14" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Scale: 1.2 px/ft vertical. Edit depths/formations as needed. Export to PNG/PDF for publication.</text>
</svg>

