<?xml version="1.0" encoding="UTF-8"?>
<!-- PM-07 (5-zone nested monitoring well) and PT-01c (extraction) schematic
     PM-07 construction:
       Zone 1 (deepest): 0-645 ft casing, 645-665 ft screen (DAS fiber strapped to casing)
       Zone 2: 0-485 ft casing, 485-505 ft screen
       Zone 3: 0-420 ft casing, 420-440 ft screen
       Zone 4: 0-360 ft casing, 360-380 ft screen
       Zone 5 (shallowest): 0-290 ft casing, 290-310 ft screen
     Scale: 1.2 px/ft vertical
     Edit freely in any SVG editor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1226" width="1800" height="1226">
  <defs>
    <linearGradient id="bellflower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b3b3"/>
      <stop offset="100%" stop-color="#d28686"/>
    </linearGradient>
    <linearGradient id="gage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe792"/>
      <stop offset="100%" stop-color="#e7c760"/>
    </linearGradient>
    <linearGradient id="lynwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#97b7ff"/>
      <stop offset="100%" stop-color="#6a93f0"/>
    </linearGradient>
    <linearGradient id="brackish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e6c97"/>
      <stop offset="100%" stop-color="#56547a"/>
    </linearGradient>
    <linearGradient id="lsp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb788"/>
      <stop offset="100%" stop-color="#4f9b6b"/>
    </linearGradient>
    <pattern id="screen-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e3f2ff"/>
      <path d="M0 0 L0 8" stroke="#5b9fff" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="1800" height="110" fill="#4f7bd6"/>
  <text x="40" y="52" fill="#ffffff" font-size="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">Cross Section: PM-07 (5-zone nested) and PT-01c (extraction)</text>
  <text x="40" y="90" fill="#eaf2ff" font-size="24" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">DAS fiber strapped to PM-07 Zone 1 casing; pump test temperature and axial strain monitoring</text>

   <!-- Depth axis and grid (0–805 ft bgs) -->
   <g id="grid" transform="translate(0,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
     <rect x="0" y="0" width="1800" height="966" fill="#ffffff"/>
     <g stroke="#d1d5db" stroke-dasharray="4 4" opacity="0.6">
       <!-- 50 ft spacing: 60 px per 50 ft = 1.2 px/ft -->
       <line x1="20" y1="0" x2="1780" y2="0"/>
       <line x1="20" y1="60" x2="1780" y2="60"/>
       <line x1="20" y1="120" x2="1780" y2="120"/>
       <line x1="20" y1="180" x2="1780" y2="180"/>
       <line x1="20" y1="240" x2="1780" y2="240"/>
       <line x1="20" y1="300" x2="1780" y2="300"/>
       <line x1="20" y1="360" x2="1780" y2="360"/>
       <line x1="20" y1="420" x2="1780" y2="420"/>
       <line x1="20" y1="480" x2="1780" y2="480"/>
       <line x1="20" y1="540" x2="1780" y2="540"/>
       <line x1="20" y1="600" x2="1780" y2="600"/>
       <line x1="20" y1="660" x2="1780" y2="660"/>
       <line x1="20" y1="720" x2="1780" y2="720"/>
       <line x1="20" y1="780" x2="1780" y2="780"/>
       <line x1="20" y1="840" x2="1780" y2="840"/>
       <line x1="20" y1="900" x2="1780" y2="900"/>
       <line x1="20" y1="960" x2="1780" y2="960"/>
     </g>
     <g id="depth-axis" transform="translate(20,0)" fill="#374151" font-size="15" font-weight="600">
       <rect x="-6" y="0" width="6" height="966" fill="#111827"/>
       <text x="16" y="5">0 ft</text>
       <text x="16" y="65">50 ft</text>
       <text x="16" y="125">100 ft</text>
       <text x="16" y="185">150 ft</text>
       <text x="16" y="245">200 ft</text>
       <text x="16" y="305">250 ft</text>
       <text x="16" y="365">300 ft</text>
       <text x="16" y="425">350 ft</text>
       <text x="16" y="485">400 ft</text>
       <text x="16" y="545">450 ft</text>
       <text x="16" y="605">500 ft</text>
       <text x="16" y="665">550 ft</text>
       <text x="16" y="725">600 ft</text>
       <text x="16" y="785">650 ft</text>
       <text x="16" y="845">700 ft</text>
       <text x="16" y="905">750 ft</text>
       <text x="16" y="965">800 ft</text>
     </g>
   </g>

  <!-- Geological sequences (1.2 px/ft scale) -->
  <g id="formations" transform="translate(0,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <!-- Mesa: 0-159.139 ft = 0-191 px -->
    <rect x="120" y="0" width="1560" height="191" fill="url(#bellflower)"/>
    <!-- Pacific: 159.139-328.736 ft = 191-394 px -->
    <rect x="120" y="191" width="1560" height="203" fill="url(#gage)"/>
    <!-- Harbor: 328.736-481.859 ft = 394-578 px -->
    <rect x="120" y="394" width="1560" height="184" fill="url(#lynwood)"/>
    <!-- Bent Spring: 481.859-579.527 ft = 578-695 px -->
    <rect x="120" y="578" width="1560" height="117" fill="url(#brackish)"/>
     <!-- Upper Wilmington B: 579.527-805 ft = 695-966 px -->
     <rect x="120" y="695" width="1560" height="271" fill="url(#lsp)"/>

     <g fill="#000000" font-size="28" font-weight="700" text-anchor="middle">
       <text x="900" y="95">Mesa</text>
       <text x="900" y="290">Pacific</text>
       <text x="900" y="485">Harbor</text>
       <text x="900" y="635" fill="#000000">Bent Spring</text>
       <text x="900" y="830" fill="#000000">Upper Wilmington B</text>
     </g>
  </g>

  <!-- PM-07 nested well (5 zones) - scale 1.2 px/ft -->
  <g id="PM-07" transform="translate(400,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-40" y="-20" font-size="26" font-weight="700" fill="#111827">PM-07</text>
    
    <!-- Borehole envelope -->
    <ellipse cx="0" cy="400" rx="90" ry="400" fill="#e0e0e0" opacity="0.4"/>
    
     <!-- Zone 5 (shallowest): 0-290 casing, 290-310 screen - LEFT of Zone 3 -->
     <g id="zone5">
       <rect x="-64" y="0" width="16" height="348" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="-64" y="348" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="-86" y="-8" font-size="14" font-weight="700" fill="#111827">Z5</text>
       <text x="-134" y="360" font-size="18" font-weight="700" fill="#111827">290-310'</text>
     </g>
     
     <!-- Zone 3: 0-420 casing, 420-440 screen - LEFT of Zone 1 -->
     <g id="zone3">
       <rect x="-32" y="0" width="16" height="504" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="-32" y="504" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="-54" y="-8" font-size="14" font-weight="700" fill="#111827">Z3</text>
       <text x="-102" y="516" font-size="18" font-weight="700" fill="#111827">420-440'</text>
     </g>
     
     <!-- Zone 1 (deepest): 0-645 casing, 645-665 screen + DAS fiber - CENTER -->
     <g id="zone1">
       <rect x="0" y="0" width="16" height="774" fill="#8b9aa6" stroke="#111827" stroke-width="2.5"/>
       <rect x="0" y="774" width="16" height="24" fill="url(#screen-hatch)" stroke="#111827" stroke-width="2.5"/>
       <!-- Fiber strapped to outside of Zone 1 casing -->
       <rect x="17" y="0" width="5" height="798" fill="#ff2c55"/>
       <text x="-22" y="-8" font-size="14" font-weight="700" fill="#111827">Z1</text>
       <text x="-70" y="786" font-size="18" font-weight="700" fill="#111827">645-665'</text>
       <text x="30" y="400" font-size="16" fill="#ff2c55" font-weight="700" transform="rotate(90 30 400)">DAS fiber</text>
     </g>
     
     <!-- Zone 2: 0-485 casing, 485-505 screen - RIGHT of Zone 1 -->
     <g id="zone2">
       <rect x="32" y="0" width="16" height="582" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="32" y="582" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="10" y="-8" font-size="14" font-weight="700" fill="#111827">Z2</text>
       <text x="54" y="594" font-size="18" font-weight="700" fill="#111827">485-505'</text>
     </g>
     
     <!-- Zone 4: 0-360 casing, 360-380 screen - RIGHT of Zone 2 -->
     <g id="zone4">
       <rect x="64" y="0" width="16" height="432" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="64" y="432" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="42" y="-8" font-size="14" font-weight="700" fill="#111827">Z4</text>
       <text x="86" y="444" font-size="18" font-weight="700" fill="#111827">360-380'</text>
     </g>
  </g>

   <!-- PT-01c extraction well (total depth 310 ft, screen 260-310 ft) -->
   <g id="PT-01c" transform="translate(1400,140)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
     <text x="-30" y="-20" font-size="26" font-weight="700" fill="#111827">PT-01c</text>
     <!-- Casing (0-260 ft = 0-312 px) -->
     <rect x="-50" y="0" width="100" height="312" fill="#6b7280" stroke="#374151" stroke-width="2"/>
     <!-- Screen interval (260-310 ft = 312-372 px) -->
     <rect x="-50" y="312" width="100" height="60" fill="#2563eb" opacity="0.7" stroke="#1e40af" stroke-width="2"/>
     <!-- Screen depth label -->
     <text x="60" y="350" font-size="18" font-weight="700" fill="#111827">260-310'</text>
     <!-- Extraction arrow pointing up inside well -->
     <path d="M0,360 L0,250" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
     <text x="0" y="230" font-size="18" fill="#111827" font-weight="900" text-anchor="middle">Extraction</text>
   </g>

  <!-- Flow towards PT-01c during pumping -->
  <g id="flow" transform="translate(0,140)">
    <path d="M550,360 L1340,360" stroke="#1e40af" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="800" y="380" font-size="22" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1e40af" font-weight="800">Groundwater flow to extraction well</text>
  </g>

  <!-- Callouts for temperature and strain -->
  <g id="callouts" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">
    <!-- Temperature response -->
    <path d="M640,720 C580,680 520,640 460,600" fill="none" stroke="#0aa" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="360" y="715" width="440" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="375" y="745" font-size="18" fill="#0aa">No temperature anomalies detected (DTS)</text>
    </g>
    
    <!-- Strain response area circle with smooth gradient pattern -->
    <defs>
      <radialGradient id="strain-gradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
        <stop offset="20%" style="stop-color:#dc2626;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#e11d48;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="80%" style="stop-color:#84cc16;stop-opacity:1" />
        <stop offset="90%" style="stop-color:#22c55e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
      </radialGradient>
    </defs>
    <!-- Axial strain on Zone 1 -->
    <path d="M580,360 C575,362 570,364 30,380" fill="none" stroke="#8e44ad" stroke-width="4" marker-end="url(#arrow)"/>
    
    <!-- Strain response circle at start of arrow -->
    <circle cx="580" cy="360" r="60" fill="url(#strain-gradient)" stroke="#8e44ad" stroke-width="3"/>
    <text x="580" y="365" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Strain</text>
    <g filter="url(#shadow)">
      <rect x="220" y="420" width="520" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="235" y="450" font-size="18" fill="#8e44ad">Axial strain from drawdown (poroelastic response)</text>
    </g>
  </g>

   <!-- Legend -->
   <g id="legend" transform="translate(800,1000)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
     <rect x="0" y="0" width="700" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#shadow)"/>
     <g transform="translate(20,24)" font-size="16" fill="#111827">
       <rect x="0" y="-10" width="28" height="12" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <text x="38" y="-2">Casing</text>
       
       <rect x="140" y="-10" width="28" height="12" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="178" y="-2">Screen</text>
       
       <rect x="280" y="-10" width="28" height="12" fill="#ff2c55"/>
       <text x="318" y="-2">Fiber optic (DAS)</text>
       
       <rect x="520" y="-10" width="28" height="12" fill="#2563eb"/>
       <text x="558" y="-2">PT-01c screen</text>
     </g>
   </g>

   <!-- Footer -->
   <text x="60" y="1216" fill="#6b7280" font-size="14" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Scale: 1.2 px/ft vertical. Edit depths/formations as needed. Export to PNG/PDF for publication.</text>
</svg>

