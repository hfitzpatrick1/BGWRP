<?xml version="1.0" encoding="UTF-8"?>
<!-- PM-07 (5-zone nested monitoring well) and PT-01c (extraction) schematic
     PM-07 construction:
       Zone 1 (deepest): 0-645 ft casing, 645-665 ft screen (DAS fiber strapped to casing)
       Zone 2: 0-485 ft casing, 485-505 ft screen
       Zone 3: 0-420 ft casing, 420-440 ft screen
       Zone 4: 0-360 ft casing, 360-380 ft screen
       Zone 5 (shallowest): 0-290 ft casing, 290-310 ft screen
     Scale: 1.2 px/ft vertical
     Edit freely in any SVG editor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1600" width="2200" height="1600">
  <defs>
    <linearGradient id="bellflower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b3b3"/>
      <stop offset="100%" stop-color="#d28686"/>
    </linearGradient>
    <linearGradient id="gage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe792"/>
      <stop offset="100%" stop-color="#e7c760"/>
    </linearGradient>
    <linearGradient id="lynwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#97b7ff"/>
      <stop offset="100%" stop-color="#6a93f0"/>
    </linearGradient>
    <linearGradient id="brackish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e6c97"/>
      <stop offset="100%" stop-color="#56547a"/>
    </linearGradient>
    <linearGradient id="lsp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb788"/>
      <stop offset="100%" stop-color="#4f9b6b"/>
    </linearGradient>
    <pattern id="screen-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e3f2ff"/>
      <path d="M0 0 L0 8" stroke="#5b9fff" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="2200" height="110" fill="#4f7bd6"/>
  <text x="40" y="52" fill="#ffffff" font-size="44" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">Distributed Fiber Optic Sensing applied to Aquifer Pump Test</text>

   <!-- Depth axis and grid (0–805 ft bgs) -->
   <g id="grid" transform="translate(0,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
     <rect x="0" y="0" width="2200" height="840" fill="#ffffff"/>
     <g stroke="#d1d5db" stroke-dasharray="4 4" opacity="0.6">
       <!-- 50 ft spacing: 60 px per 50 ft = 1.2 px/ft -->
       <line x1="20" y1="0" x2="2180" y2="0"/>
       <line x1="20" y1="60" x2="2180" y2="60"/>
       <line x1="20" y1="120" x2="2180" y2="120"/>
       <line x1="20" y1="180" x2="2180" y2="180"/>
       <line x1="20" y1="240" x2="2180" y2="240"/>
       <line x1="20" y1="300" x2="2180" y2="300"/>
       <line x1="20" y1="360" x2="2180" y2="360"/>
       <line x1="20" y1="420" x2="2180" y2="420"/>
       <line x1="20" y1="480" x2="2180" y2="480"/>
       <line x1="20" y1="540" x2="2180" y2="540"/>
       <line x1="20" y1="600" x2="2180" y2="600"/>
       <line x1="20" y1="660" x2="2180" y2="660"/>
       <line x1="20" y1="720" x2="2180" y2="720"/>
       <line x1="20" y1="780" x2="2180" y2="780"/>
       <line x1="20" y1="840" x2="2180" y2="840"/>
     </g>
     <g id="depth-axis" transform="translate(20,0)" fill="#374151" font-size="15" font-weight="600">
       <rect x="-6" y="0" width="6" height="840" fill="#000000"/>
       <text x="16" y="15">0 ft</text>
       <text x="16" y="75">50 ft</text>
       <text x="16" y="130">100 ft</text>
       <text x="16" y="190">150 ft</text>
       <text x="16" y="250">200 ft</text>
       <text x="16" y="310">250 ft</text>
       <text x="16" y="370">300 ft</text>
       <text x="16" y="430">350 ft</text>
       <text x="16" y="490">400 ft</text>
       <text x="16" y="550">450 ft</text>
       <text x="16" y="610">500 ft</text>
       <text x="16" y="670">550 ft</text>
       <text x="16" y="730">600 ft</text>
       <text x="16" y="790">650 ft</text>
       <text x="16" y="830">700 ft</text>
     </g>
   </g>

  <!-- Geological sequences (1.2 px/ft scale) -->
  <g id="formations" transform="translate(0,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <!-- Bellflower Aquiclude: 0-170 ft = 0-204 px -->
    <rect x="120" y="0" width="2060" height="204" fill="url(#bellflower)"/>
    <!-- Gage-Gardena Aquifer: 170-300 ft = 204-360 px -->
    <rect x="120" y="204" width="2060" height="156" fill="url(#gage)"/>
    <!-- Lynwood/Silverado Aquifer: 300-460 ft = 360-552 px -->
    <rect x="120" y="360" width="2060" height="192" fill="url(#lynwood)"/>
    <!-- Lynwood/Silverado Brackish: 460-565 ft = 552-678 px -->
    <rect x="120" y="552" width="2060" height="126" fill="url(#brackish)"/>
     <!-- Lower San Pedro Fm.: 565-700 ft = 678-840 px -->
     <rect x="120" y="678" width="2060" height="162" fill="url(#lsp)"/>

     <g fill="#000000" font-size="28" font-weight="700" text-anchor="start">
      <text x="1750" y="102">Bellflower Aquiclude</text>
      <text x="1750" y="282">Gage-Gardena Aquifer</text>
      <text x="1750" y="456">Lynwood/Silverado Aquifer</text>
      <text x="1750" y="615" fill="#000000">Lynwood/Silverado Brackish</text>
      <text x="1750" y="759" fill="#000000">Upper Pico Formation</text>
     </g>
  </g>

  <!-- PM-07 nested well (5 zones) - scale 1.2 px/ft -->
  <g id="PM-07" transform="translate(400,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-40" y="-20" font-size="26" font-weight="700" fill="#ffffff">PM-07</text>
    
    <!-- Borehole envelope -->
    <ellipse cx="0" cy="400" rx="90" ry="400" fill="#e0e0e0" opacity="0.4"/>
    
     <!-- Zone 5 (shallowest): 0-290 casing, 290-310 screen - LEFT of Zone 3 -->
     <g id="zone5">
       <rect x="-64" y="0" width="16" height="348" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="-64" y="348" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="-56" y="-8" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Z5</text>
       <text x="-154" y="360" font-size="18" font-weight="700" fill="#111827">290-310'</text>
     </g>
     
     <!-- Zone 3: 0-420 casing, 420-440 screen - LEFT of Zone 1 -->
     <g id="zone3">
       <rect x="-32" y="0" width="16" height="504" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="-32" y="504" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="-24" y="-8" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Z3</text>
       <text x="-122" y="516" font-size="18" font-weight="700" fill="#111827">420-440'</text>
     </g>
     
     <!-- Zone 1 (deepest): 0-645 casing, 645-665 screen + DAS fiber - CENTER -->
     <g id="zone1">
       <rect x="0" y="0" width="16" height="774" fill="#8b9aa6" stroke="#111827" stroke-width="2.5"/>
       <rect x="0" y="774" width="16" height="24" fill="url(#screen-hatch)" stroke="#111827" stroke-width="2.5"/>
       <!-- Fiber strapped to outside of Zone 1 casing -->
       <rect x="17" y="0" width="5" height="798" fill="#ff2c55"/>
       <text x="8" y="-8" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Z1</text>
       <text x="-90" y="786" font-size="18" font-weight="700" fill="#111827">645-665'</text>
     </g>
     
     <!-- Zone 2: 0-485 casing, 485-505 screen - RIGHT of Zone 1 -->
     <g id="zone2">
       <rect x="32" y="0" width="16" height="582" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="32" y="582" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="40" y="-8" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Z2</text>
       <text x="74" y="594" font-size="18" font-weight="700" fill="#111827">485-505'</text>
     </g>
     
     <!-- Zone 4: 0-360 casing, 360-380 screen - RIGHT of Zone 2 -->
     <g id="zone4">
       <rect x="64" y="0" width="16" height="432" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <rect x="64" y="432" width="16" height="24" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="72" y="-8" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Z4</text>
       <text x="106" y="444" font-size="18" font-weight="700" fill="#111827">360-380'</text>
     </g>
  </g>

  <!-- PT-01c extraction well (total depth 310 ft, screen 260-310 ft) -->
  <!-- PM-07 at x=400, PT-01c is 177 ft away -->
  <g id="PT-01c" transform="translate(1108,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-30" y="-20" font-size="26" font-weight="700" fill="#ffffff">PT-01c</text>
    <!-- Casing (0-260 ft = 0-312 px) -->
    <rect x="-50" y="0" width="100" height="312" fill="#6b7280" stroke="#374151" stroke-width="2"/>
    <!-- Screen interval (260-310 ft = 312-372 px) -->
    <rect x="-50" y="312" width="100" height="60" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="2"/>
    <!-- Screen depth label -->
    <text x="60" y="350" font-size="18" font-weight="700" fill="#111827">260-310'</text>
    <!-- Extraction arrow pointing up inside well -->
    <path d="M0,360 L0,250" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="0" y="230" font-size="18" fill="#111827" font-weight="900" text-anchor="middle">Extraction</text>
  </g>

  <!-- PT-01a extraction well (total depth 510 ft, screen 450-510 ft) -->
  <!-- 60 ft from PT-01c (237 ft from PM-07) -->
  <g id="PT-01a" transform="translate(1348,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-30" y="-20" font-size="26" font-weight="700" fill="#ffffff">PT-01a</text>
    <!-- Casing (0-450 ft = 0-540 px) -->
    <rect x="-50" y="0" width="100" height="540" fill="#6b7280" stroke="#374151" stroke-width="2"/>
    <!-- Screen interval (450-510 ft = 540-612 px) -->
    <rect x="-50" y="540" width="100" height="72" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="2"/>
    <!-- Screen depth label -->
    <text x="60" y="578" font-size="18" font-weight="700" fill="#111827">450-510'</text>
    <!-- Extraction arrow pointing up inside well -->
    <path d="M0,600 L0,490" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="0" y="470" font-size="18" fill="#111827" font-weight="900" text-anchor="middle">Extraction</text>
  </g>

  <!-- PT-01b extraction well (total depth 400 ft, screen 350-400 ft) -->
  <!-- 60 ft from PT-01a (297 ft from PM-07) -->
  <g id="PT-01b" transform="translate(1588,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="-30" y="-20" font-size="26" font-weight="700" fill="#ffffff">PT-01b</text>
    <!-- Casing (0-350 ft = 0-420 px) -->
    <rect x="-50" y="0" width="100" height="420" fill="#6b7280" stroke="#374151" stroke-width="2"/>
    <!-- Screen interval (350-400 ft = 420-480 px) -->
    <rect x="-50" y="420" width="100" height="60" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="2"/>
    <!-- Screen depth label -->
    <text x="60" y="458" font-size="18" font-weight="700" fill="#111827">350-400'</text>
    <!-- Extraction arrow pointing up inside well -->
    <path d="M0,468 L0,358" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="0" y="338" font-size="18" fill="#111827" font-weight="900" text-anchor="middle">Extraction</text>
  </g>

  <!-- Distance annotation between PM-07 and PT-01c -->
  <g id="distance-annotation" transform="translate(0,110)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- Horizontal dimension line -->
    <line x1="400" y1="80" x2="1108" y2="80" stroke="#111827" stroke-width="2.5"/>
    <!-- End ticks -->
    <line x1="400" y1="70" x2="400" y2="90" stroke="#111827" stroke-width="2.5"/>
    <line x1="1108" y1="70" x2="1108" y2="90" stroke="#111827" stroke-width="2.5"/>
    <!-- Distance label -->
    <text x="754" y="70" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">177 ft</text>
  </g>

  <!-- Flow towards extraction wells during pumping -->
  <g id="flow" transform="translate(0,110)">
    <path d="M550,360 L1050,360" stroke="#1e40af" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="800" y="395" font-size="22" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1e40af" font-weight="800" text-anchor="middle">Groundwater flow to extraction wells</text>
  </g>

  <!-- Callouts for temperature and strain -->
  <g id="callouts" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">
    <!-- Temperature response -->
    <path d="M640,720 C580,680 520,640 417,600" fill="none" stroke="#0aa" stroke-width="4"/>
    <circle cx="640" cy="720" r="60" fill="url(#temp-gradient)"/>
    <text x="640" y="725" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Temp</text>
    <g filter="url(#shadow)">
      <rect x="420" y="615" width="520" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="680" y="645" font-size="18" fill="#0aa" text-anchor="middle">Temperature Measured by DTS (preferential flow paths)</text>
    </g>
    
    <!-- Strain response area circle with smooth gradient pattern -->
    <defs>
      <radialGradient id="temp-gradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
      </radialGradient>
      <radialGradient id="strain-gradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
        <stop offset="20%" style="stop-color:#dc2626;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#e11d48;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="80%" style="stop-color:#84cc16;stop-opacity:1" />
        <stop offset="90%" style="stop-color:#22c55e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
      </radialGradient>
    </defs>
    <!-- Axial strain on Zone 1 -->
    <path d="M580,320 C575,322 570,324 417,320" fill="none" stroke="#8e44ad" stroke-width="4"/>
    
    <!-- Strain response circle at start of arrow -->
    <circle cx="580" cy="320" r="60" fill="url(#strain-gradient)" stroke="#8e44ad" stroke-width="3"/>
    <text x="580" y="325" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Strain</text>
    <g filter="url(#shadow)">
      <rect x="220" y="380" width="520" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="480" y="410" font-size="18" fill="#8e44ad" text-anchor="middle">Axial Strain Measured by DAS (poroelastic response)</text>
    </g>
  </g>

   <!-- Legend -->
   <g id="legend" transform="translate(1750,15)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
     <rect x="0" y="0" width="420" height="80" rx="8" fill="#ffffff" opacity="0.95" stroke="#d1d5db" stroke-width="2"/>
     <text x="210" y="22" font-size="18" fill="#111827" font-weight="700" text-anchor="middle">Legend</text>
     <g transform="translate(25,40)" font-size="15" fill="#111827">
       <rect x="0" y="0" width="24" height="10" fill="#8b9aa6" stroke="#4a5661" stroke-width="1.5"/>
       <text x="32" y="9">Casing</text>
       
       <rect x="115" y="0" width="24" height="10" fill="url(#screen-hatch)" stroke="#4a5661" stroke-width="1.5"/>
       <text x="147" y="9">Screen</text>
       
       <rect x="230" y="0" width="24" height="10" fill="#ff2c55"/>
       <text x="262" y="9">Fiber Optic</text>
     </g>
   </g>

   <!-- Footer -->
   <text x="60" y="1390" fill="#6b7280" font-size="14" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Scale: 1.2 px/ft vertical. PT-01c is 177 ft from PM-07; extraction wells spaced 60 ft apart. Export to PNG/PDF for publication.</text>
</svg>

